global:
  scrape_interval: 10s
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090
  - job_name: node
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: scrapper
    static_configs:
      - targets:
          - host.docker.internal:8079

  - job_name: bot
    static_configs:
      - targets:
          - host.docker.internal:8078
